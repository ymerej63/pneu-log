<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SUIVI DES PNEUS</title>
<meta name="theme-color" content="#0E0E0C">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pneus">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/zxing-wasm@2/dist/iife/reader/index.js"></script>
<style>
  /* OCR-B — la police des étiquettes à code-barres (Frutiger, 1968).
     Version libre sous SIL Open Font License. */
  @font-face{
    font-family:'OCR-B';
    src:url('https://cdn.jsdelivr.net/gh/raisty/OCR-B@1.1/dist/OCR-B.ttf') format('truetype'),
        url('https://cdn.jsdelivr.net/gh/raisty/OCR-B@1.1/dist/OCR-B.otf') format('opentype');
    font-weight:400;font-style:normal;font-display:swap;
  }
  :root{
    --yel:#F0C000;
    --yel-dim:#9A7D0A;
    --blk:#0E0E0C;
    --card:#181815;
    --card2:#201F1A;
    --line:#2E2C25;
    --off:#F2EFE4;
    --grey:#8B8779;
    --red:#D8341F;
    --red-dim:#6E2418;
    --green:#63C97A;
    --f-disp:'Archivo Black',sans-serif;
    --f-lbl:'Barlow Condensed',sans-serif;
    --f-num:'OCR-B','Space Mono',monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;height:100%;background:var(--blk);color:var(--off);
    font-family:var(--f-lbl);overscroll-behavior:none;
  }
  #app{
    max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;position:relative;background:var(--blk);
  }

  /* Zéro dessiné : le DOM conserve un vrai « 0 » (recherche, copie, export). */
  .z0{display:inline-block;width:1ch;height:.72em;vertical-align:baseline;position:relative;}
  .z0 svg{position:absolute;left:50%;transform:translateX(-50%);height:100%;width:auto;}

  .strip{
    height:7px;flex-shrink:0;
    background:repeating-linear-gradient(90deg,var(--blk) 0 5px,var(--yel) 5px 8px);
  }

  /* ---------- En-tête jaune (accueil) ---------- */
  .masthead{
    background:var(--yel);color:var(--blk);
    padding:calc(13px + env(safe-area-inset-top,0px)) 16px 11px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .masthead h1{
    font-family:var(--f-disp);font-size:19px;line-height:.92;letter-spacing:-.5px;
    margin:0;text-transform:uppercase;
  }
  .masthead .meta{
    font-family:'Space Mono',monospace;font-size:9px;text-align:right;line-height:1.55;
    text-transform:uppercase;
  }

  /* ---------- Barre de navigation (fiche, formulaire) ---------- */
  .navbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;
    border-bottom:1px solid var(--line);background:var(--blk);
  }
  .navbar .back{
    font-family:var(--f-lbl);font-weight:600;font-size:14px;letter-spacing:1.3px;
    text-transform:uppercase;color:var(--grey);background:none;border:none;cursor:pointer;
    padding:6px 0;flex-shrink:0;
  }
  .navbar .title{
    font-family:var(--f-lbl);font-weight:700;font-size:14px;letter-spacing:1.6px;
    text-transform:uppercase;color:var(--off);text-align:center;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .navbar .navright{flex-shrink:0;min-width:58px;text-align:right;}
  .icon-btn{
    background:none;border:none;color:var(--grey);cursor:pointer;font-size:16px;padding:6px;
  }
  .icon-btn.danger{color:var(--red);}

  main{flex:1;padding:15px 15px 0;padding-bottom:104px;}

  /* ---------- Boutons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-family:var(--f-disp);font-size:13.5px;letter-spacing:.4px;text-transform:uppercase;
    border:none;padding:14px 12px;cursor:pointer;width:100%;
  }
  .btn-primary{background:var(--yel);color:var(--blk);}
  .btn-primary:active{background:#D8AD00;}
  .btn-ghost{background:transparent;color:var(--off);border:1px solid var(--line);}
  .btn-ghost:active{background:var(--card);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red-dim);}
  .btn-sm{padding:9px 13px;font-size:11.5px;width:auto;}
  .fab{
    position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));
    left:50%;transform:translateX(-50%);max-width:450px;width:calc(100% - 30px);z-index:6;
    box-shadow:0 10px 28px rgba(0,0,0,.65);
  }

  /* ---------- Onglets d'accueil ---------- */
  .hometabs{display:flex;gap:6px;margin-bottom:14px;}
  .hometab{
    flex:1;font-family:var(--f-lbl);font-weight:600;font-size:14px;letter-spacing:1.4px;
    text-transform:uppercase;padding:8px;cursor:pointer;
    background:transparent;color:var(--grey);border:1px solid var(--line);
  }
  .hometab.active{background:var(--off);color:var(--blk);border-color:var(--off);}
  .hometab.tab-icon{flex:0 0 46px;font-size:15px;letter-spacing:0;}

  /* ---------- Filtres de position ---------- */
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    font-family:var(--f-lbl);font-weight:600;font-size:13.5px;letter-spacing:1.1px;
    text-transform:uppercase;padding:7px 12px;cursor:pointer;
    background:var(--card);color:var(--grey);border:1px solid var(--line);
  }
  .chip.active{background:var(--yel);color:var(--blk);border-color:var(--yel);}

  /* ---------- Carte pneu (vignette) ---------- */
  .card{
    display:flex;align-items:stretch;gap:11px;background:var(--card);
    border:1px solid var(--line);margin-bottom:8px;padding:9px;cursor:pointer;
  }
  .card .vig{
    width:56px;flex-shrink:0;background:var(--yel);color:var(--blk);
    display:flex;align-items:center;justify-content:center;padding:6px 3px;
  }
  .card .vig span{
    font-family:var(--f-disp);font-size:16px;letter-spacing:-.4px;line-height:1;
  }
  .card.card-hs .vig{background:var(--red);color:#fff;}
  .card.card-hs{opacity:.6;}
  .card .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .card .code{
    font-family:var(--f-num);font-size:19px;letter-spacing:.4px;line-height:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .card .sub{
    font-family:var(--f-num);font-size:10.5px;text-transform:uppercase;
    color:var(--grey);margin-top:5px;
  }
  .card .sub b{color:var(--off);font-weight:400;}
  .hs-toggle{
    display:block;width:100%;text-align:left;background:none;border:none;color:var(--grey);
    font-family:var(--f-lbl);font-weight:600;font-size:13.5px;letter-spacing:1.2px;
    text-transform:uppercase;padding:12px 2px;cursor:pointer;
  }

  /* ---------- Vue Train ---------- */
  .train-list{display:flex;gap:6px;overflow-x:auto;margin-bottom:15px;padding-bottom:3px;}
  .train-item{
    flex-shrink:0;font-family:var(--f-lbl);font-weight:600;font-size:13px;letter-spacing:.9px;
    text-transform:uppercase;padding:6px 11px;cursor:pointer;white-space:nowrap;
    background:var(--card);color:var(--grey);border:1px solid var(--line);
  }
  .train-item.active{background:var(--yel);color:var(--blk);border-color:var(--yel);}
  .car-view{display:grid;grid-template-columns:1fr 1fr;gap:9px;position:relative;}
  .car-view::before{
    content:'';position:absolute;left:50%;top:6%;bottom:6%;width:1px;
    background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px);
  }
  .car-slot{
    background:var(--card);border:1px solid var(--line);padding:10px;text-align:left;
    color:var(--off);cursor:default;
  }
  .car-slot[data-tirekey]{cursor:pointer;}
  .car-slot .slot-label{
    display:inline-block;background:var(--yel);color:var(--blk);
    font-family:var(--f-disp);font-size:10px;padding:2px 6px;letter-spacing:-.2px;
  }
  .car-slot .slot-tireid{
    font-family:var(--f-num);font-size:15px;margin:7px 0 2px;display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .car-slot .slot-empty{font-family:var(--f-num);font-size:15px;color:#4A4740;margin:7px 0 2px;display:block;}
  .car-slot .slot-sub{font-family:var(--f-num);font-size:10.5px;color:var(--grey);}
  .car-slot.is-hs{opacity:.55;}
  .car-slot.is-hs .slot-label{background:var(--red);color:#fff;}
  .legend{
    font-family:var(--f-num);font-size:10px;color:var(--grey);
    margin-top:13px;line-height:1.6;border-top:1px solid var(--line);padding-top:10px;
  }

  /* ---------- Fiche pneu ---------- */
  .hero{background:var(--yel);color:var(--blk);padding:14px 16px 12px;position:relative;}
  .hero .hcode{
    font-family:var(--f-num);font-size:31px;letter-spacing:1.5px;line-height:1;
    padding-right:66px;word-break:break-all;
  }
  .hero .hbar{display:block;margin-bottom:6px;}
  .hero .hpos{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    background:var(--blk);color:var(--yel);font-family:var(--f-disp);
    font-size:17px;padding:9px 11px;letter-spacing:-.4px;
  }
  .hero.is-hs{background:#B9A44A;}
  .hero.is-hs .hpos{background:var(--red);color:#fff;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);}
  .stats > div{padding:12px 8px;border-right:1px solid var(--line);text-align:center;}
  .stats > div:last-child{border-right:none;}
  .stats .sv{font-family:var(--f-num);font-size:19px;color:var(--yel);line-height:1.1;}
  .stats .sk{
    font-family:var(--f-lbl);font-weight:600;font-size:10px;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--grey);margin-top:3px;
  }
  .actions{display:flex;gap:8px;margin-bottom:12px;}
  .sect{
    font-family:var(--f-lbl);font-weight:700;font-size:12px;letter-spacing:1.8px;
    text-transform:uppercase;color:var(--grey);margin:20px 0 9px;
    display:flex;justify-content:space-between;align-items:baseline;
  }

  /* ---------- Roulage (accordéon) ---------- */
  .session{border:1px solid var(--line);background:var(--card);margin-bottom:8px;}
  .run-head{display:flex;align-items:stretch;gap:11px;padding:9px;cursor:pointer;}
  .run-num{
    width:50px;flex-shrink:0;background:var(--yel);color:var(--blk);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--f-disp);font-size:14px;letter-spacing:-.3px;
  }
  .run-main{flex:1;min-width:0;}
  .run-t{
    font-family:var(--f-lbl);font-weight:600;font-size:15px;letter-spacing:.8px;
    text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .run-s{font-family:var(--f-num);font-size:10.5px;color:var(--grey);margin-top:3px;}
  .run-chev{color:var(--grey);align-self:center;font-size:12px;}
  .session.open .run-chev{color:var(--yel);transform:rotate(180deg);}
  .run-body{border-top:1px solid var(--line);padding:11px;display:none;}
  .session.open .run-body{display:block;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-bottom:11px;}
  .grid2 > div{background:var(--card2);padding:8px 10px;}
  .grid2 .gk{
    font-family:var(--f-lbl);font-weight:600;font-size:9.5px;letter-spacing:1.3px;
    text-transform:uppercase;color:var(--grey);
  }
  .grid2 .gv{font-family:var(--f-num);font-size:15px;margin-top:2px;}
  .grid2 .gv em{font-style:normal;font-size:10px;color:var(--grey);}
  .note{
    background:var(--card2);padding:9px 10px;margin-bottom:11px;
    font-family:var(--f-lbl);font-weight:500;font-size:14px;letter-spacing:.4px;
    color:#D8D3C4;line-height:1.4;
  }
  .note b{
    display:block;font-weight:700;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;
    color:var(--grey);margin-bottom:3px;
  }
  .rowbtns{display:flex;gap:7px;}
  .rowbtns button{
    flex:1;font-family:var(--f-lbl);font-weight:600;font-size:12.5px;letter-spacing:1.2px;
    text-transform:uppercase;padding:9px 4px;cursor:pointer;
    background:transparent;border:1px solid var(--line);color:var(--grey);
  }
  .rowbtns button.del{color:var(--red);border-color:var(--red-dim);}

  /* ---------- Formulaire ---------- */
  .tagline{
    background:var(--yel);color:var(--blk);padding:8px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .tagline .tcode{
    font-family:var(--f-num);font-size:17px;letter-spacing:1.2px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .tagline .tpos{
    background:var(--blk);color:var(--yel);font-family:var(--f-disp);
    font-size:11px;padding:3px 8px;flex-shrink:0;
  }
  label{
    display:block;font-family:var(--f-lbl);font-weight:700;font-size:10.5px;
    letter-spacing:1.6px;text-transform:uppercase;color:var(--grey);margin:16px 0 5px;
  }
  main > label:first-child{margin-top:0;}
  input[type=text],input[type=date],input[type=number],textarea,select{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:0;
    padding:11px 12px;color:var(--off);font-size:15px;font-family:var(--f-num);
    -webkit-appearance:none;appearance:none;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--yel);}
  input::placeholder,textarea::placeholder{color:#4E4B44;}
  textarea{
    min-height:62px;resize:vertical;
    font-family:var(--f-lbl);font-weight:500;font-size:15px;letter-spacing:.3px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .unit{position:relative;}
  .unit > span{
    position:absolute;right:11px;top:50%;transform:translateY(-50%);
    font-family:var(--f-lbl);font-weight:600;font-size:12px;letter-spacing:1.2px;
    color:var(--grey);text-transform:uppercase;pointer-events:none;
  }
  .poscar{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative;
    border:1px solid var(--line);padding:14px;background:var(--card);
  }
  .poscar::before{
    content:'';position:absolute;left:50%;top:14px;bottom:14px;width:1px;
    background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px);
  }
  .poscar button{
    font-family:var(--f-disp);font-size:14px;padding:14px 6px;cursor:pointer;
    background:var(--card2);color:var(--grey);border:1px solid var(--line);letter-spacing:-.3px;
  }
  .poscar button.active{background:var(--yel);color:var(--blk);border-color:var(--yel);}
  .poscar .poscar-clear{
    grid-column:1/-1;font-family:var(--f-lbl);font-weight:600;font-size:12px;
    letter-spacing:1.2px;text-transform:uppercase;padding:8px;background:transparent;
  }
  .form-actions{display:flex;gap:9px;margin-top:22px;}

  /* ---------- Scanner ---------- */
  .scan-wrap{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;}
  .scan-header{
    position:absolute;top:0;left:0;right:0;z-index:4;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px;
  }
  .scan-header button{
    font-family:var(--f-lbl);font-weight:600;font-size:14px;letter-spacing:1.3px;
    text-transform:uppercase;background:rgba(12,12,10,.72);color:var(--off);
    border:1px solid rgba(240,192,0,.35);padding:7px 12px;cursor:pointer;
  }
  #scanner-container{position:absolute;inset:0;overflow:hidden;background:#000;}
  #scanner-container video{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    min-width:100%;min-height:100%;width:auto;height:auto;
  }
  .viewfinder{
    position:absolute;left:7%;right:7%;top:44%;transform:translateY(-50%);
    height:185px;pointer-events:none;box-shadow:0 0 0 2000px rgba(8,8,6,.6);
  }
  .vf-corner{position:absolute;width:30px;height:30px;border:3px solid var(--yel);}
  .vf-corner.tl{top:-2px;left:-2px;border-right:none;border-bottom:none;}
  .vf-corner.tr{top:-2px;right:-2px;border-left:none;border-bottom:none;}
  .vf-corner.bl{bottom:-2px;left:-2px;border-right:none;border-top:none;}
  .vf-corner.br{bottom:-2px;right:-2px;border-left:none;border-top:none;}
  .laser{
    position:absolute;left:6px;right:6px;height:2px;background:var(--yel);
    box-shadow:0 0 12px 2px rgba(240,192,0,.7);animation:sweep 2.4s ease-in-out infinite;
  }
  @keyframes sweep{0%,100%{top:8px}50%{top:173px}}
  .scan-hint{
    position:absolute;bottom:0;left:0;right:0;padding:20px 16px calc(26px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);text-align:center;z-index:3;
  }
  .scan-hint p{
    font-family:var(--f-lbl);font-weight:600;font-size:14px;letter-spacing:1.6px;
    text-transform:uppercase;color:var(--off);margin:0 0 12px;
  }
  .manual-toggle{
    font-family:var(--f-lbl);font-weight:600;font-size:13px;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--yel);background:none;border:none;cursor:pointer;
    text-decoration:underline;padding:8px;
  }

  /* ---------- Feuilles coulissantes ---------- */
  .manual-sheet{
    position:absolute;bottom:0;left:0;right:0;background:var(--card);z-index:5;
    border-top:2px solid var(--yel);padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
    max-height:88%;overflow-y:auto;
  }
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:15;}
  .home-sheet{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    max-width:480px;width:100%;background:var(--card);border-top:2px solid var(--yel);
    padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:16;
  }
  .home-sheet h2{
    font-family:var(--f-disp);text-transform:uppercase;font-size:15px;margin:0 0 12px;
  }
  .home-sheet .btn{margin-bottom:9px;}
  .home-sheet .hint{
    font-family:var(--f-lbl);font-weight:500;font-size:14px;letter-spacing:.3px;
    color:var(--grey);line-height:1.45;margin:0 0 14px;
  }

  /* ---------- États ---------- */
  .empty{text-align:center;padding:52px 20px;color:var(--grey);}
  .empty p{
    font-family:var(--f-lbl);font-weight:500;font-size:15px;letter-spacing:.3px;
    line-height:1.5;max-width:270px;margin:0 auto;
  }
  .empty svg{opacity:.4;margin-bottom:14px;}
  .loading{font-family:var(--f-num);font-size:12px;color:var(--grey);}

  .update-banner{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;gap:12px;z-index:31;
    background:var(--card2);border:1px solid var(--yel);
    padding:9px 10px 9px 14px;max-width:calc(100% - 30px);
    font-family:var(--f-lbl);font-weight:600;font-size:14px;letter-spacing:.8px;
    text-transform:uppercase;
  }
  .update-banner button{
    font-family:var(--f-disp);font-size:11.5px;background:var(--yel);color:var(--blk);
    border:none;padding:8px 11px;cursor:pointer;text-transform:uppercase;
  }
  .offline-badge{
    display:none;align-items:center;gap:5px;font-family:'Space Mono',monospace;
    font-size:9px;letter-spacing:.5px;color:var(--blk);
    border:1px solid rgba(0,0,0,.45);padding:1px 6px;margin-top:2px;
  }
  .offline-badge.show{display:inline-flex;}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--card2);border:1px solid var(--yel);padding:11px 18px;
    font-family:var(--f-lbl);font-weight:600;font-size:14px;letter-spacing:.7px;
    text-transform:uppercase;z-index:30;opacity:0;transition:opacity .25s;
    pointer-events:none;max-width:calc(100% - 30px);text-align:center;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const POSITIONS = [
  {id:'AVD', label:'AV. DROIT', color:'#FF5A1F'},
  {id:'AVG', label:'AV. GAUCHE', color:'#FFB020'},
  {id:'ARD', label:'AR. DROIT', color:'#4CAF7D'},
  {id:'ARG', label:'AR. GAUCHE', color:'#4C9AFF'},
];
const SESSION_TYPES = ['EL1','EL2','Q','C1','C2','C3','C4'];
const APP_VERSION = 'v14';

let state = { view: 'home', tireKey: null, filterPos: null, homeTab: 'pneus', showHS: false, trainKey: null };

function posInfo(id){ return POSITIONS.find(p=>p.id===id) || {label:id||'—', color:'#FF5A1F'}; }
function getLatestSession(t){
  if(!t.sessions || !t.sessions.length) return null;
  return [...t.sessions].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.id-a.id))[0];
}
function getEffectivePosition(t){
  const latest = getLatestSession(t);
  return (latest && latest.position) || t.position || null;
}
function buildTrainGroups(tires){
  const map = new Map();
  tires.forEach(t=>{
    (t.sessions||[]).forEach(s=>{
      if(!s.location && !s.sessionType) return;
      const locKey = (s.location||'').trim().toLowerCase();
      const key = locKey+'|'+(s.sessionType||'');
      if(!map.has(key)){
        map.set(key, { key, location: s.location||'—', sessionType: s.sessionType||'', date: s.date||'', slots:{} });
      }
      const g = map.get(key);
      if(s.date && s.date > g.date) g.date = s.date;
      if(s.position){
        const existing = g.slots[s.position];
        if(!existing || (s.date||'') >= (existing.date||'')){
          g.slots[s.position] = { tireId: t.id, tireKey: t.key, km: s.km, laps: s.laps, date: s.date, hs: !!t.hs };
        }
      }
    });
  });
  return [...map.values()].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
}
function sanitizeKey(raw){ return ('t_'+raw).replace(/[^a-zA-Z0-9_.:-]/g,'_').slice(0,190); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  const [y,m,day] = String(d).split('-');
  return day ? `${day}/${m}/${y}` : String(d);
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML;
}

// ---------- Service worker (offline) ----------
let swWaiting = null;
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // une nouvelle version est prête : on propose de recharger
      const watch = (worker)=>{
        if(!worker) return;
        worker.addEventListener('statechange', ()=>{
          if(worker.state==='installed' && navigator.serviceWorker.controller){
            swWaiting = worker;
            showUpdateBanner();
          }
        });
      };
      if(reg.waiting && navigator.serviceWorker.controller){
        swWaiting = reg.waiting;
        showUpdateBanner();
      }
      reg.addEventListener('updatefound', ()=> watch(reg.installing));
      // vérifie les mises à jour au retour au premier plan
      document.addEventListener('visibilitychange', ()=>{
        if(!document.hidden) reg.update().catch(()=>{});
      });
    }).catch(e=>console.warn('SW registration failed', e));
  });
}
function showUpdateBanner(){
  if(document.getElementById('update-banner')) return;
  const b = document.createElement('div');
  b.id = 'update-banner';
  b.className = 'update-banner';
  b.innerHTML = `<span>Nouvelle version disponible</span><button id="update-now">Recharger</button>`;
  document.body.appendChild(b);
  document.getElementById('update-now').onclick = ()=>{
    if(swWaiting) swWaiting.postMessage({type:'SKIP_WAITING'});
    location.reload();
  };
}

// ---------- Indicateur hors ligne ----------
function updateOnlineBadge(){
  const el = document.getElementById('offline-badge');
  if(el) el.classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online', ()=>{ updateOnlineBadge(); showToast('Connexion rétablie'); });
window.addEventListener('offline', ()=>{ updateOnlineBadge(); });

// ---------- Beep ----------
let audioCtx = null;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){ /* audio unavailable, ignore */ }
}
function playBeep(){
  if(!audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 1800;
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.13);
  }catch(e){}
}

// ---------- Storage ----------
const STORE_PREFIX = 'pneu-log:';
async function getIndex(){
  try{
    const raw = localStorage.getItem(STORE_PREFIX+'tire-index');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
async function saveIndex(list){
  try{ localStorage.setItem(STORE_PREFIX+'tire-index', JSON.stringify(list)); }
  catch(e){ console.error('index save failed', e); }
}
async function getTire(key){
  try{
    const raw = localStorage.getItem(STORE_PREFIX+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function saveTire(key, tire){
  try{ localStorage.setItem(STORE_PREFIX+key, JSON.stringify(tire)); return true; }
  catch(e){ console.error('tire save failed', e); return false; }
}
async function deleteTire(key){
  try{ localStorage.removeItem(STORE_PREFIX+key); }catch(e){}
  delete openSessions[key];
  delete scrollMemory['detail:'+key];
  const idx = await getIndex();
  await saveIndex(idx.filter(k=>k!==key));
}
async function findOrCreateTire(rawId){
  const key = sanitizeKey(rawId);
  let tire = await getTire(key);
  let isNew = false;
  if(!tire){
    tire = { id: rawId, key, position: null, hs: false, createdAt: Date.now(), sessions: [] };
    isNew = true;
    const idx = await getIndex();
    if(!idx.includes(key)){ idx.push(key); await saveIndex(idx); }
    await saveTire(key, tire);
  }
  return { tire, isNew };
}

// ---------- Export / Import ----------
async function getAllTires(){
  const idx = await getIndex();
  return (await Promise.all(idx.map(getTire))).filter(Boolean);
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function exportJSON(){
  const tires = await getAllTires();
  if(tires.length===0){ showToast('Aucune donnée à exporter'); return; }
  const payload = { app:'suivi-pneus', version:1, exportedAt:new Date().toISOString(), tires };
  downloadBlob(new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'}), `suivi-pneus-${todayStr()}.json`);
  showToast('Export JSON généré');
}
function csvCell(v){
  const s = String(v ?? '');
  return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
async function exportCSV(){
  const tires = await getAllTires();
  if(tires.length===0){ showToast('Aucune donnée à exporter'); return; }
  const header = ['pneu','position','date','lieu','session','tours','km','pression_froid_bar','pression_chaud_bar','reglages','usure'];
  const rows = [header.join(';')];
  tires.forEach(t=>{
    if(t.sessions.length===0){
      rows.push([t.id, t.position||'', '', '', '', '', '', '', '', '', ''].map(csvCell).join(';'));
    }
    t.sessions.forEach(s=>{
      rows.push([t.id, s.position||t.position||'', s.date, s.location, s.sessionType, s.laps, s.km,
        s.pressureCold, s.pressureHot, s.setup, s.wear].map(csvCell).join(';'));
    });
  });
  // BOM pour qu'Excel FR reconnaisse l'UTF-8
  downloadBlob(new Blob(['\ufeff'+rows.join('\r\n')], {type:'text/csv;charset=utf-8'}), `suivi-pneus-${todayStr()}.csv`);
  showToast('Export CSV généré');
}
function importJSON(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0];
    if(!file) return;
    try{
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data.tires;
      if(!Array.isArray(list)) throw new Error('format');
      let added = 0, merged = 0;
      for(const imp of list){
        if(!imp || !imp.id) continue;
        const key = imp.key || sanitizeKey(imp.id);
        const existing = await getTire(key);
        if(existing){
          const known = new Set(existing.sessions.map(s=>s.id));
          const news = (imp.sessions||[]).filter(s=>!known.has(s.id));
          if(news.length){
            existing.sessions = existing.sessions.concat(news)
              .sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a.id-b.id));
            merged += news.length;
          }
          if(!existing.position && imp.position) existing.position = imp.position;
          // un pneu déclaré HS d'un côté ou de l'autre le reste après fusion
          if(imp.hs) existing.hs = true;
          await saveTire(key, existing);
        } else {
          await saveTire(key, { id: imp.id, key, position: imp.position||null,
            hs: !!imp.hs,
            createdAt: imp.createdAt||Date.now(), sessions: imp.sessions||[] });
          const idx = await getIndex();
          if(!idx.includes(key)){ idx.push(key); await saveIndex(idx); }
          added++;
        }
      }
      showToast(`Import : ${added} pneu${added>1?'s':''}, ${merged} roulage${merged>1?'s':''} ajoutés`);
      go('home');
    }catch(e){
      console.error(e);
      showToast('Fichier invalide — export JSON attendu');
    }
  };
  inp.click();
}
function showDataSheet(){
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  const sheet = document.createElement('div');
  sheet.className = 'home-sheet';
  sheet.innerHTML = `
    <h2>Sauvegarde des données</h2>
    <div class="hint">Les données vivent dans le navigateur : pense à exporter après chaque week-end de course. Le JSON sert de sauvegarde/restauration, le CSV pour l'analyse (Excel, etc.).</div>
    <button class="btn btn-primary" id="ds-json">⤓ &nbsp;Exporter la sauvegarde (JSON)</button>
    <button class="btn btn-ghost" id="ds-csv">⤓ &nbsp;Exporter pour analyse (CSV)</button>
    <button class="btn btn-ghost" id="ds-import">⤒ &nbsp;Importer une sauvegarde</button>
    <button class="btn btn-ghost" id="ds-close">Fermer</button>
  `;
  const close = ()=>{ backdrop.remove(); sheet.remove(); };
  backdrop.onclick = close;
  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);
  document.getElementById('ds-json').onclick = ()=>{ exportJSON(); };
  document.getElementById('ds-csv').onclick = ()=>{ exportCSV(); };
  document.getElementById('ds-import').onclick = ()=>{ close(); importJSON(); };
  document.getElementById('ds-close').onclick = close;
}

// ---------- Mémoire de position (scroll + accordéons) ----------
// Chaque vue garde sa position de défilement : revenir d'un pneu ou d'un roulage
// ne renvoie plus en haut de la liste.
const scrollMemory = {};
const openSessions = {}; // tireKey -> Set des ids de roulages dépliés

function scrollEl(){ return document.scrollingElement || document.documentElement; }
function viewScrollKey(st){
  if(st.view==='home') return 'home:'+(st.homeTab||'pneus')+':'+(st.filterPos||'');
  if(st.view==='detail') return 'detail:'+st.tireKey;
  return null; // scan / form : toujours en haut
}
function rememberScroll(){
  const k = viewScrollKey(state);
  if(k) scrollMemory[k] = scrollEl().scrollTop || 0;
}
function restoreScroll(){
  const k = viewScrollKey(state);
  const y = (k && scrollMemory[k]) || 0;
  scrollEl().scrollTop = y;
  // second passage après layout : les cartes/accordéons viennent d'être insérés
  requestAnimationFrame(()=>{ scrollEl().scrollTop = y; });
}
function openSet(tireKey){
  if(!openSessions[tireKey]) openSessions[tireKey] = new Set();
  return openSessions[tireKey];
}

// ---------- Router ----------
function render(){
  stopCamera();
  const v = document.getElementById('view');
  let p = null;
  if(state.view==='home') p = renderHome(v);
  else if(state.view==='scan') p = renderScan(v);
  else if(state.view==='detail') p = renderDetail(v);
  else if(state.view==='form') p = renderForm(v);
  const target = state.view;
  return Promise.resolve(p).then(()=>{
    // si le rendu a redirigé (pneu introuvable), c'est l'autre render qui restaure
    if(state.view===target) restoreScroll();
  });
}
function go(view, opts={}){
  rememberScroll();
  state = {...state, ...opts, view};
  return render();
}

// ---------- Helpers de rendu (étiquette FIA) ----------
// Le zéro d'OCR-B porte une pastille centrale absente des vraies étiquettes.
// On le remplace par un ovale vectoriel : le texte du DOM reste un vrai « 0 »,
// donc recherche, copier-coller et exports ne sont pas affectés.
const ZERO_SVG = '<span class="z0"><svg viewBox="0 0 72 100">'
  + '<rect x="7" y="7" width="58" height="86" rx="29" ry="29" fill="none" '
  + 'stroke="currentColor" stroke-width="12"/></svg></span>';
function z(text){ return String(text ?? '').replace(/0/g, ZERO_SVG); }

// Code-barres Interleaved 2 of 5 — même symbologie que les étiquettes FIA.
const ITF_ENC = {'0':'NNWWN','1':'WNNNW','2':'NWNNW','3':'WWNNN','4':'NNWNW',
                 '5':'WNWNN','6':'NWWNN','7':'NNNWW','8':'WNNWN','9':'NWNWN'};
function barcodeFor(id, w, h, color, opacity){
  const code = String(id||'');
  // ITF n'encode que des chiffres, par paires : sinon pas de code-barres décoratif
  if(!/^\d+$/.test(code) || code.length % 2 !== 0) return '';
  const bars = [];
  const push = (dark, wide) => bars.push({d:dark, w:wide?3:1});
  for(let i=0;i<4;i++) push(i%2===0, false);
  for(let i=0;i+1<code.length;i+=2){
    const b = ITF_ENC[code[i]], s = ITF_ENC[code[i+1]];
    if(!b || !s) return '';
    for(let j=0;j<5;j++){ push(true, b[j]==='W'); push(false, s[j]==='W'); }
  }
  push(true,true); push(false,false); push(true,false);
  const units = bars.reduce((a,b)=>a+b.w,0), u = w/units;
  let x = 0, rects = '';
  bars.forEach(b=>{
    if(b.d) rects += `<rect x="${(x*u).toFixed(2)}" y="0" width="${(b.w*u).toFixed(2)}" height="${h}"/>`;
    x += b.w;
  });
  return `<svg class="hbar" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" `
       + `style="display:block;opacity:${opacity}" fill="${color}">${rects}</svg>`;
}

// Date compacte pour les listes : 19.07.26
function fmtDateShort(d){
  if(!d) return '—';
  const [y,m,day] = String(d).split('-');
  return day ? `${day}.${m}.${String(y).slice(-2)}` : String(d);
}
function nf(n){ return String(n).replace('.', ','); }

// ---------- Home ----------
function tireCardHtml(t){
  const pos = getEffectivePosition(t);
  const last = getLatestSession(t);
  const n = t.sessions.length;
  const km = Math.round(t.sessions.reduce((s,x)=>s+(Number(x.km)||0),0) * 10) / 10;
  const bits = [`<b>${z(n)}</b> roulage${n>1?'s':''}`];
  if(km) bits.push(`<b>${z(nf(km))}</b> km`);
  if(last && last.date) bits.push(z(fmtDateShort(last.date)));
  return `
    <div class="card ${t.hs?'card-hs':''}" data-key="${t.key}">
      <div class="vig"><span>${t.hs ? 'HS' : (pos || '—')}</span></div>
      <div class="info">
        <div class="code">${z(escapeHtml(t.id))}</div>
        <div class="sub">${bits.join(' · ')}</div>
      </div>
    </div>`;
}

async function renderHome(v){
  v.innerHTML = `
    <div class="masthead">
      <h1>Suivi<br>des pneus</h1>
      <div class="meta" id="mast-meta">
        Escot Compétition<br>${APP_VERSION} · scanner FIA<br>
        <span id="mast-count">—</span>
        <span class="offline-badge" id="offline-badge">● HORS LIGNE</span>
      </div>
    </div>
    <div class="strip"></div>
    <main id="home-main"><p class="loading">Chargement…</p></main>
    <button class="btn btn-primary fab" id="scan-fab" style="${state.homeTab==='train'?'display:none;':''}">Scanner un pneu</button>
  `;
  document.getElementById('scan-fab').onclick = () => go('scan');
  updateOnlineBadge();

  const idx = await getIndex();
  const tires = (await Promise.all(idx.map(getTire))).filter(Boolean);
  tires.sort((a,b)=>{
    const la = getLatestSession(a)?.date || '';
    const lb = getLatestSession(b)?.date || '';
    return lb.localeCompare(la);
  });

  const totalRuns = tires.reduce((s,t)=>s+(t.sessions?t.sessions.length:0), 0);
  const count = document.getElementById('mast-count');
  if(count){
    count.innerHTML = z(String(tires.length).padStart(2,'0')) + ' pneus · '
                    + z(String(totalRuns).padStart(2,'0')) + ' roulages';
  }

  const main = document.getElementById('home-main');
  const tabsHtml = `
    <div class="hometabs">
      <button class="hometab ${state.homeTab!=='train'?'active':''}" id="tab-pneus">Pneus</button>
      <button class="hometab ${state.homeTab==='train'?'active':''}" id="tab-train">Train</button>
      <button class="hometab tab-icon" id="data-btn" title="Sauvegarde / export">⇅</button>
    </div>`;

  if(tires.length===0){
    main.innerHTML = `
      ${tabsHtml}
      <div class="empty">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M21 12h-3M6 12H3"/></svg>
        <p>Aucun pneu enregistré. Scanne l'étiquette FIA d'un pneu pour commencer son historique.</p>
      </div>`;
    bindHomeTabs(main);
    return;
  }

  if(state.homeTab==='train'){
    main.innerHTML = `${tabsHtml}<div id="train-zone"></div>`;
    bindHomeTabs(main);
    renderTrainTab(document.getElementById('train-zone'), tires);
    return;
  }

  const activeTires = tires.filter(t=>!t.hs);
  const hsTires = tires.filter(t=>t.hs);
  const filtered = state.filterPos ? activeTires.filter(t=>getEffectivePosition(t)===state.filterPos) : activeTires;

  const chips = ['<button class="chip '+(!state.filterPos?'active':'')+'" data-p="">Tous</button>']
    .concat(POSITIONS.map(p=>`<button class="chip ${state.filterPos===p.id?'active':''}" data-p="${p.id}">${p.id}</button>`));

  main.innerHTML = `
    ${tabsHtml}
    <div class="chips">${chips.join('')}</div>
    <div id="cards"></div>
    ${hsTires.length ? `
      <button class="hs-toggle" id="hs-toggle">${state.showHS?'▾':'▸'} Pneus HS (${hsTires.length})</button>
      ${state.showHS ? `<div id="hs-cards"></div>` : ''}
    ` : ''}
  `;
  bindHomeTabs(main);
  main.querySelectorAll('.chip').forEach(c=>{
    c.onclick = () => go('home', {filterPos: c.dataset.p || null});
  });

  const cards = document.getElementById('cards');
  if(filtered.length===0){
    cards.innerHTML = `<div class="empty"><p>Aucun pneu sur cette position.</p></div>`;
  } else {
    cards.innerHTML = filtered.map(tireCardHtml).join('');
    cards.querySelectorAll('.card').forEach(c=>{
      c.onclick = () => go('detail', {tireKey: c.dataset.key});
    });
  }

  const hsToggle = document.getElementById('hs-toggle');
  if(hsToggle) hsToggle.onclick = () => go('home', {showHS: !state.showHS});
  const hsCards = document.getElementById('hs-cards');
  if(hsCards){
    hsCards.innerHTML = hsTires.map(tireCardHtml).join('');
    hsCards.querySelectorAll('.card').forEach(c=>{
      c.onclick = () => go('detail', {tireKey: c.dataset.key});
    });
  }
}
function bindHomeTabs(main){
  main.querySelector('#tab-pneus').onclick = () => go('home', {homeTab:'pneus'});
  main.querySelector('#tab-train').onclick = () => go('home', {homeTab:'train'});
  main.querySelector('#data-btn').onclick = showDataSheet;
}

function renderTrainTab(zone, tires){
  const groups = buildTrainGroups(tires);
  if(groups.length===0){
    zone.innerHTML = `<div class="empty"><p>Aucun roulage avec un lieu renseigné. Ajoute un roulage pour voir apparaître le train.</p></div>`;
    return;
  }
  if(!state.trainKey || !groups.find(g=>g.key===state.trainKey)){
    state.trainKey = groups[0].key;
  }
  const list = groups.map(g=>`
    <button class="train-item ${g.key===state.trainKey?'active':''}" data-key="${g.key}">
      ${escapeHtml(g.location)}${g.sessionType?` · ${escapeHtml(g.sessionType)}`:''}
    </button>`).join('');

  const active = groups.find(g=>g.key===state.trainKey);
  const slotHtml = (posId)=>{
    const info = posInfo(posId);
    const entry = active.slots[posId];
    if(!entry){
      return `<div class="car-slot">
        <span class="slot-label">${info.label}</span>
        <span class="slot-empty">—</span>
        <span class="slot-sub">Non renseigné</span>
      </div>`;
    }
    const sub = [];
    if(entry.km) sub.push(z(nf(entry.km)) + ' km');
    if(entry.laps) sub.push(z(entry.laps) + ' tr');
    return `<div class="car-slot ${entry.hs?'is-hs':''}" data-tirekey="${entry.tireKey}">
      <span class="slot-label">${entry.hs ? 'HS · '+info.label : info.label}</span>
      <span class="slot-tireid">${z(escapeHtml(entry.tireId))}</span>
      <span class="slot-sub">${sub.join(' · ') || '—'}</span>
      ${barcodeFor(entry.tireId, 108, 11, '#F0C000', .5)}
    </div>`;
  };

  const filled = ['AVG','AVD','ARG','ARD'].filter(p=>active.slots[p]).length;

// ---------- Décodeur FIA-ITF spécialisé ----------
// Les étiquettes FIA sont en Interleaved 2 of 5, 8 chiffres, souvent usées/craquelées.
// Les librairies génériques lisent ligne par ligne : chaque fissure casse la lecture.
// Ici : détection de l'étiquette jaune, redressement, puis MOYENNE VERTICALE des
// barres (répare les fissures) avant décodage. Validé sur photos réelles.
const ITF_PAT = {'NNWWN':'0','WNNNW':'1','NWNNW':'2','WWNNN':'3','NNWNW':'4',
                 'WNWNN':'5','NWWNN':'6','NNNWW':'7','WNNWN':'8','NWNWN':'9'};

function median(arr){
  const s = arr.slice().sort((a,b) => a-b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}

function itfRunsFromProfile(profile){
  const n = profile.length;
  const k = Math.max(31, Math.round(n / 9) | 1);
  const half = k >> 1;
  const cum = new Float64Array(n + 1);
  for(let i = 0; i < n; i++) cum[i+1] = cum[i] + profile[i];
  const runs = [];
  let cur = -1, count = 0;
  for(let i = 0; i < n; i++){
    const a = Math.max(0, i - half), b = Math.min(n, i + half + 1);
    const base = (cum[b] - cum[a]) / (b - a);
    const v = profile[i] < base - 6 ? 1 : 0;
    if(v === cur) count++;
    else { if(cur >= 0) runs.push([cur, count]); cur = v; count = 1; }
  }
  runs.push([cur, count]);
  return runs;
}

function itfDecodeRuns(runs){
  runs = runs.slice();
  while(runs.length && runs[0][0] === 0) runs.shift();
  while(runs.length && runs[runs.length-1][0] === 0) runs.pop();
  if(runs.length < 47) return null;
  for(let start = 0; start + 47 <= runs.length; start++){
    const seg = runs.slice(start, start + 47);
    if(seg[0][0] !== 1) continue;
    const widths = seg.map(r => r[1]);
    const narrow = median(widths.slice().sort((a,b) => a-b).slice(0, 20));
    if(narrow < 1.6) continue;
    const cls = widths.map(w => {
      const r = w / narrow;
      if(r < 1.8) return 'N';
      if(r < 4.5) return 'W';
      return '?';
    });
    // start : barre,espace,barre,espace étroits — stop : W N N
    if(cls[0]!=='N'||cls[1]!=='N'||cls[2]!=='N'||cls[3]!=='N') continue;
    if(cls[44]!=='W'||cls[45]!=='N'||cls[46]!=='N') continue;
    let digits = '', ok = true;
    for(let pair = 0; pair < 4; pair++){
      const base = 4 + pair*10;
      let bars = '', spaces = '';
      for(let i = 0; i < 5; i++){ bars += cls[base + 2*i]; spaces += cls[base + 2*i + 1]; }
      if(!(bars in ITF_PAT) || !(spaces in ITF_PAT)){ ok = false; break; }
      digits += ITF_PAT[bars] + ITF_PAT[spaces];
    }
    if(ok) return digits;
  }
  return null;
}

// Détecte les zones jaunes candidates (composantes connexes + filtre de forme)
function findYellowRegions(imgData){
  const d = imgData.data, w = imgData.width, h = imgData.height;
  const mask = new Uint8Array(w * h);
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      const i = (y*w + x) * 4, r = d[i], g = d[i+1], b = d[i+2];
      if(r > 95 && g > 70 && b < r*0.72 && g > r*0.55 && r >= g - 10) mask[y*w + x] = 1;
    }
  }
  // étiquetage par parcours en largeur
  const labels = new Int32Array(w * h);
  const comps = [];
  const stack = new Int32Array(w * h);
  for(let start = 0; start < w*h; start++){
    if(!mask[start] || labels[start]) continue;
    const id = comps.length + 1;
    let sp = 0; stack[sp++] = start; labels[start] = id;
    let count = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
    while(sp > 0){
      const p = stack[--sp];
      const px = p % w, py = (p / w) | 0;
      count++; sx += px; sy += py; sxx += px*px; syy += py*py; sxy += px*py;
      // 4-voisinage
      if(px > 0   && mask[p-1] && !labels[p-1]){ labels[p-1] = id; stack[sp++] = p-1; }
      if(px < w-1 && mask[p+1] && !labels[p+1]){ labels[p+1] = id; stack[sp++] = p+1; }
      if(py > 0   && mask[p-w] && !labels[p-w]){ labels[p-w] = id; stack[sp++] = p-w; }
      if(py < h-1 && mask[p+w] && !labels[p+w]){ labels[p+w] = id; stack[sp++] = p+w; }
    }
    if(count < 150) continue;
    const mx = sx/count, my = sy/count;
    const cxx = sxx/count - mx*mx, cyy = syy/count - my*my, cxy = sxy/count - mx*my;
    const common = Math.sqrt(Math.max(0, ((cxx-cyy)/2)*((cxx-cyy)/2) + cxy*cxy));
    const l1 = (cxx+cyy)/2 + common, l2 = Math.max((cxx+cyy)/2 - common, 0.5);
    const aspect = Math.sqrt(l1 / l2);
    // une étiquette code-barres est un rectangle allongé (ratio ~3-4)
    if(aspect < 1.7 || aspect > 8) continue;
    comps.push({ count, cx: mx, cy: my,
                 angle: 0.5 * Math.atan2(2*cxy, cxx - cyy),
                 halfW: Math.sqrt(l1) * 1.95,
                 halfH: Math.sqrt(l2) * 2.3 });
  }
  comps.sort((a,b) => b.count - a.count);
  return comps.slice(0, 4);
}

// Pipeline complet : trouve l'étiquette dans un canvas, la redresse, décode
const fiaWork = document.createElement('canvas');
const fiaLabel = document.createElement('canvas');
function fiaDecodeFromCanvas(srcCanvas){
  const sw = srcCanvas.width, sh = srcCanvas.height;
  if(!sw || !sh) return null;
  // 1) détection jaune sur version réduite
  const detW = 420, scale = detW / sw;
  fiaWork.width = detW; fiaWork.height = Math.max(1, Math.round(sh * scale));
  const wctx = fiaWork.getContext('2d', { willReadFrequently: true });
  wctx.drawImage(srcCanvas, 0, 0, fiaWork.width, fiaWork.height);
  const regions = findYellowRegions(wctx.getImageData(0, 0, fiaWork.width, fiaWork.height));
  for(const reg of regions){
    const code = fiaDecodeRegion(srcCanvas, reg, scale);
    if(code) return code;
  }
  return null;
}

function fiaDecodeRegion(srcCanvas, reg, scale){
  const sw = srcCanvas.width, sh = srcCanvas.height;
  // 2) redressement à bonne résolution depuis la source
  const fcx = reg.cx/scale, fcy = reg.cy/scale;
  const HW = Math.min(reg.halfW/scale, sw), HH = Math.min(reg.halfH/scale, sh);
  if(HW < 40) return null; // étiquette trop petite / trop loin
  const outW = 900, outScale = outW / (2*HW*1.06);
  fiaLabel.width = outW;
  fiaLabel.height = Math.max(60, Math.min(500, Math.round(2*HH*1.15*outScale)));
  const lctx = fiaLabel.getContext('2d', { willReadFrequently: true });
  lctx.setTransform(1,0,0,1,0,0);
  lctx.fillStyle = '#808080';
  lctx.fillRect(0, 0, fiaLabel.width, fiaLabel.height);
  lctx.translate(fiaLabel.width/2, fiaLabel.height/2);
  lctx.rotate(-reg.angle);
  lctx.scale(outScale, outScale);
  lctx.drawImage(srcCanvas, -fcx, -fcy);
  // 3) niveaux de gris, plusieurs bandes moyennées verticalement, deux sens
  const img = lctx.getImageData(0, 0, fiaLabel.width, fiaLabel.height);
  const W = img.width, H = img.height, data = img.data;
  const gray = new Float32Array(W * H);
  for(let i = 0, j = 0; i < data.length; i += 4, j++)
    gray[j] = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
  const bands = [[0.12,0.55],[0.20,0.68],[0.30,0.78],[0.42,0.85],[0.15,0.42],[0.55,0.85]];
  const votes = {};
  for(const tb of bands){
    const y0 = Math.round(H*tb[0]), y1 = Math.max(y0+3, Math.round(H*tb[1]));
    const profile = new Float64Array(W);
    for(let x = 0; x < W; x++){
      let s = 0;
      for(let y = y0; y < y1; y++) s += gray[y*W + x];
      profile[x] = s / (y1 - y0);
    }
    const rev = Float64Array.from(profile).reverse();
    for(const p of [profile, rev]){
      const code = itfDecodeRuns(itfRunsFromProfile(p));
      if(code) votes[code] = (votes[code] || 0) + 1;
    }
  }
  let best = null, bestN = 0;
  for(const c in votes) if(votes[c] > bestN){ best = c; bestN = votes[c]; }
  return best;
}

// ---------- Scanner (caméra gérée en direct + décodage ZXing-C++ WebAssembly) ----------
let detectionLocked = false;
let recentReads = [];
let scanStream = null;
let scanAbort = false;

function stopCamera(){
  scanAbort = true;
  if(scanStream){ try{ scanStream.getTracks().forEach(t=>t.stop()); }catch(e){} scanStream = null; }
}

function setScanStatus(msg){
  const p = document.querySelector('#hint p');
  if(p) p.textContent = msg;
}

async function startCamera(){
  detectionLocked = false;
  recentReads = [];
  scanAbort = false;
  const video = document.getElementById('scan-video');

  try{
    if(typeof ZXingWASM === 'undefined') throw new Error('librairie de scan non chargée (connexion ?)');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('caméra non disponible dans ce navigateur');

    // 1) Caméra pilotée directement
    scanStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    video.srcObject = scanStream;
    await video.play();
    setupTorch();
    setScanStatus('Chargement du décodeur…');

    // 2) Boucle de scan : bande centrale de l'image → ZXing-C++ (WASM)
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let decoderReady = false;
    let errorShown = false;

    while(!scanAbort && !detectionLocked){
      if(video.videoWidth){
        const vw = video.videoWidth, vh = video.videoHeight;
        const cw = Math.round(vw * 0.96), ch = Math.round(vh * 0.72);
        const cx = Math.round((vw - cw) / 2), cy = Math.round((vh - ch) / 2);
        canvas.width = cw; canvas.height = ch;
        ctx.drawImage(video, cx, cy, cw, ch, 0, 0, cw, ch);

        // A) Décodeur FIA spécialisé (moyenne verticale, résiste à l'usure)
        try{
          const fia = fiaDecodeFromCanvas(canvas);
          if(fia) handleDetected(fia);
        }catch(e){ console.warn('fia decoder', e); }

        // B) ZXing-C++ WASM en secours (autres codes / cas généraux)
        if(!detectionLocked) try{
          const results = await ZXingWASM.readBarcodes(
            ctx.getImageData(0, 0, cw, ch),
            { tryHarder: true, tryRotate: true, tryInvert: true, maxNumberOfSymbols: 1 }
          );
          if(!decoderReady){
            decoderReady = true;
            setScanStatus("Scanner actif — vise l'étiquette");
          }
          if(results && results.length && results[0].text){
            handleDetected(results[0].text);
          }
        }catch(e){
          console.error(e);
          if(!errorShown){
            errorShown = true;
            setScanStatus('Erreur décodeur : ' + (e && e.message ? e.message : e));
          }
        }
      }
      await new Promise(r => setTimeout(r, 120));
    }
  }catch(err){
    console.error(err);
    stopCamera();
    showCameraError("Scanner impossible à démarrer : " + (err && err.message ? err.message : err) + ". Tu peux saisir le code manuellement.");
  }
}

function handleDetected(code){
  if(detectionLocked || !code) return;

  // Verrouillage : codes FIA (8 chiffres) après 2 lectures identiques,
  // autres formats après 3 (anti fausse lecture)
  recentReads.push(code);
  if(recentReads.length > 6) recentReads.shift();
  const needed = /^\d{8}$/.test(code) ? 2 : 3;
  if(recentReads.filter(c => c === code).length < needed) return;

  detectionLocked = true;
  recentReads = [];
  playBeep();
  onBarcodeFound(code);
}

let torchOn = false;
function setupTorch(){
  torchOn = false;
  const btn = document.getElementById('torch-btn');
  const video = document.getElementById('scan-video');
  if(!btn || !video || !video.srcObject) return;
  try{
    const track = video.srcObject.getVideoTracks()[0];
    const caps = track && track.getCapabilities ? track.getCapabilities() : null;
    if(!caps || !caps.torch) return; // non supporté (souvent le cas sur iPhone)
    btn.style.display = 'inline-flex';
    btn.onclick = async () => {
      try{
        torchOn = !torchOn;
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        btn.textContent = torchOn ? '🔦 Torche ON' : '🔦 Torche';
      }catch(e){ console.warn('torch failed', e); }
    };
  }catch(e){ /* ignore */ }
}

function photoHD(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0];
    if(!file) return;
    setScanStatus('Analyse de la photo…');
    try{
      let bmp;
      try{ bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
      catch(e){ bmp = await createImageBitmap(file); }
      // limiter à 2600px de large (suffisant, validé sur photos réelles)
      const maxW = 2600;
      const sc = Math.min(1, maxW / bmp.width);
      const pc = document.createElement('canvas');
      pc.width = Math.round(bmp.width * sc);
      pc.height = Math.round(bmp.height * sc);
      pc.getContext('2d').drawImage(bmp, 0, 0, pc.width, pc.height);

      // A) décodeur FIA spécialisé
      let code = null;
      try{ code = fiaDecodeFromCanvas(pc); }catch(e){ console.warn(e); }

      // B) secours : ZXing-C++ sur l'image entière
      if(!code && typeof ZXingWASM !== 'undefined'){
        try{
          const pctx = pc.getContext('2d');
          const results = await ZXingWASM.readBarcodes(
            pctx.getImageData(0, 0, pc.width, pc.height),
            { tryHarder: true, tryRotate: true, tryInvert: true, maxNumberOfSymbols: 1 }
          );
          if(results && results.length && results[0].text) code = results[0].text;
        }catch(e){ console.warn(e); }
      }

      if(code){
        detectionLocked = true;
        playBeep();
        onBarcodeFound(code);
      }else{
        setScanStatus("Photo illisible — rapproche-toi et réessaie");
        showToast('Code non lu sur la photo');
      }
    }catch(e){
      console.error(e);
      setScanStatus('Erreur photo : ' + (e && e.message ? e.message : e));
    }
  };
  inp.click();
}

    <div class="stats">
      <div><div class="sv">${z(String(tire.sessions.length).padStart(2,'0'))}</div><div class="sk">Roulages</div></div>
      <div><div class="sv">${totalKm ? z(nf(totalKm)) : '—'}</div><div class="sk">Km cumulés</div></div>
      <div><div class="sv">${last && last.date ? z(fmtDateShort(last.date).slice(0,5)) : '—'}</div><div class="sk">Dernier</div></div>
    </div>
    <main>
      <div class="actions">
        <button class="btn btn-primary" id="add-session">＋ Ajouter un roulage</button>
        ${tire.sessions.length ? `<button class="btn btn-ghost" id="dup-session" style="flex:0 0 108px;">⧉ Dupliquer</button>` : ''}
      </div>
      <button class="btn ${tire.hs?'btn-ghost':'btn-danger'}" id="toggle-hs">${tire.hs ? '✅ Remettre en service' : '🚫 Déclarer HS'}</button>
      <div class="sect"><span>Historique</span><span>${totalLaps ? z(totalLaps)+' tours cumulés' : ''}</span></div>
      <div id="history"></div>
    </main>
  `;
  document.getElementById('det-back').onclick = () => go('home');
  document.getElementById('add-session').onclick = () => go('form', { tireKey: tire.key });
  const dupBtn = document.getElementById('dup-session');
  if(dupBtn){
    dupBtn.onclick = () => go('form', { tireKey: tire.key, duplicateFrom: getLatestSession(tire) || null });
  }
  document.getElementById('toggle-hs').onclick = async () => {
    tire.hs = !tire.hs;
    await saveTire(tire.key, tire);
    showToast(tire.hs ? 'Pneu déclaré HS — historique conservé' : 'Pneu remis en service');
    go('detail', { tireKey: tire.key });
  };
  document.getElementById('delete-tire').onclick = async () => {
    if(!confirm(`Supprimer définitivement le pneu ${tire.id} et tout son historique (${tire.sessions.length} roulage${tire.sessions.length>1?'s':''}) ? Cette action est irréversible.`)) return;
    await deleteTire(tire.key);
    showToast('Pneu supprimé');
    go('home');
  };

  const hist = document.getElementById('history');
  if(tire.sessions.length===0){
    hist.innerHTML = `<div class="empty"><p>Aucun roulage enregistré pour ce pneu.</p></div>`;
    return;
  }
  const opened = openSet(tire.key);
  const ordered = [...tire.sessions].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.id-a.id));
  hist.innerHTML = ordered.map((s, i)=>{
    const head = [];
    if(s.km) head.push(z(nf(s.km)) + ' km');
    if(s.laps) head.push(z(s.laps) + ' tours');
    const cells = [];
    if(s.pressureCold) cells.push(`<div><div class="gk">Pression froid</div><div class="gv">${z(s.pressureCold)} <em>bar</em></div></div>`);
    if(s.pressureHot)  cells.push(`<div><div class="gk">Pression chaud</div><div class="gv">${z(s.pressureHot)} <em>bar</em></div></div>`);
    if(s.laps) cells.push(`<div><div class="gk">Tours</div><div class="gv">${z(s.laps)}</div></div>`);
    if(s.km)   cells.push(`<div><div class="gk">Distance</div><div class="gv">${z(nf(s.km))} <em>km</em></div></div>`);
    const nothing = !cells.length && !s.setup && !s.wear;
    return `
      <div class="session ${opened.has(s.id)?'open':''}" data-sid="${s.id}">
        <div class="run-head">
          <div class="run-num">${s.position || '—'}</div>
          <div class="run-main">
            <div class="run-t">${escapeHtml(s.location) || 'Lieu non renseigné'}${s.sessionType ? ' · '+escapeHtml(s.sessionType) : ''}</div>
            <div class="run-s">${z(fmtDateShort(s.date))}${head.length?' · '+head.join(' · '):''}</div>
          </div>
          <div class="run-chev">▾</div>
        </div>
        <div class="run-body">
          ${cells.length ? `<div class="grid2">${cells.join('')}</div>` : ''}
          ${s.setup ? `<div class="note"><b>Réglages</b>${escapeHtml(s.setup)}</div>` : ''}
          ${s.wear ? `<div class="note"><b>Usure constatée</b>${escapeHtml(s.wear)}</div>` : ''}
          ${nothing ? `<div class="note">Aucun détail supplémentaire renseigné.</div>` : ''}
          <div class="rowbtns">
            <button data-action="edit" data-sid="${s.id}">Modifier</button>
            <button data-action="dup" data-sid="${s.id}">Dupliquer</button>
            <button class="del" data-action="delete" data-sid="${s.id}">Supprimer</button>
          </div>
        </div>
      </div>`;
  }).join('');

  hist.querySelectorAll('.session').forEach(el=>{
    const sid = Number(el.dataset.sid);
    el.querySelector('.run-head').onclick = () => {
      el.classList.toggle('open');
      if(el.classList.contains('open')) opened.add(sid); else opened.delete(sid);
    };
  });
  hist.querySelectorAll('[data-action="edit"]').forEach(btn=>{
    btn.onclick = (e) => {
      e.stopPropagation();
      go('form', { tireKey: tire.key, editSessionId: Number(btn.dataset.sid) });
    };
  });
  hist.querySelectorAll('[data-action="dup"]').forEach(btn=>{
    btn.onclick = (e) => {
      e.stopPropagation();
      const src = tire.sessions.find(x=>x.id===Number(btn.dataset.sid));
      go('form', { tireKey: tire.key, duplicateFrom: src || null });
    };
  });
  hist.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.onclick = async (e) => {
      e.stopPropagation();
      if(!confirm('Supprimer ce roulage ? Cette action est définitive.')) return;
      const sid = Number(btn.dataset.sid);
      tire.sessions = tire.sessions.filter(x=>x.id !== sid);
      opened.delete(sid);
      const ok = await saveTire(tire.key, tire);
      showToast(ok ? 'Roulage supprimé' : "Erreur de suppression");
      rememberScroll();
      await renderDetail(v);
      restoreScroll();
    };
  });
}

// ---------- Formulaire ----------
async function renderForm(v){
  const tire = await getTire(state.tireKey);
  if(!tire){ go('home'); return; }
  const editSessionId = state.editSessionId || null;
  state.editSessionId = null;
  const editingSession = editSessionId ? tire.sessions.find(x=>x.id===editSessionId) : null;
  const duplicateFrom = editingSession ? null : (state.duplicateFrom || null);
  state.duplicateFrom = null;
  const source = editingSession || duplicateFrom;

  const prefillSession = (source ? source.sessionType : state.prefillSession) || '';
  const prefillLocation = (source ? source.location : state.prefillLocation) || '';
  state.prefillSession = null;
  state.prefillLocation = null;

  let selType = prefillSession;
  let selPos = (source ? source.position : tire.position) || null;
  const extraType = selType && !SESSION_TYPES.includes(selType) ? [selType] : [];
  const typeList = [...extraType, ...SESSION_TYPES];

  const title = editingSession ? 'Modifier le roulage'
              : (duplicateFrom ? 'Dupliquer le roulage' : 'Nouveau roulage');

  v.innerHTML = `
    <div class="navbar">
      <button class="back" id="form-back">← Annuler</button>
      <span class="title">${title}</span>
      <span class="navright"></span>
    </div>
    <div class="tagline">
      <span class="tcode">${z(escapeHtml(tire.id))}</span>
      ${selPos?`<span class="tpos" id="tag-pos">${selPos}</span>`:'<span class="tpos" id="tag-pos" style="display:none;"></span>'}
    </div>
    <div class="strip"></div>
    <main>
      <div class="row2">
        <div>
          <label>Date</label>
          <input type="date" id="f-date" value="${source ? source.date : todayStr()}">
        </div>
        <div>
          <label>Tours</label>
          <input type="number" id="f-laps" inputmode="numeric" placeholder="0" value="${source && source.laps ? source.laps : ''}">
        </div>
      </div>

      <label>Lieu / compétition</label>
      <input type="text" id="f-loc" placeholder="Ex. Chabrières, La Châtre…" value="${escapeHtml(prefillLocation)}">

      <label>Type de session</label>
      <div class="chips" id="f-types">
        ${typeList.map(t=>`<button class="chip ${t===selType?'active':''}" data-t="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
      </div>

      <label>Position sur la voiture</label>
      <div class="poscar" id="f-poscar">
        <button data-p="AVG" class="${selPos==='AVG'?'active':''}">AVG</button>
        <button data-p="AVD" class="${selPos==='AVD'?'active':''}">AVD</button>
        <button data-p="ARG" class="${selPos==='ARG'?'active':''}">ARG</button>
        <button data-p="ARD" class="${selPos==='ARD'?'active':''}">ARD</button>
      </div>

      <div class="row2">
        <div>
          <label>Pression froid</label>
          <div class="unit"><input type="number" step="0.05" id="f-pcold" inputmode="decimal" placeholder="1.80" value="${source && source.pressureCold ? source.pressureCold : ''}"><span>bar</span></div>
        </div>
        <div>
          <label>Pression chaud</label>
          <div class="unit"><input type="number" step="0.05" id="f-phot" inputmode="decimal" placeholder="2.10" value="${source && source.pressureHot ? source.pressureHot : ''}"><span>bar</span></div>
        </div>
      </div>

      <label>Distance</label>
      <div class="unit"><input type="number" step="0.1" id="f-km" inputmode="decimal" placeholder="0" value="${source && source.km ? source.km : ''}"><span>km</span></div>

      <label>Réglages</label>
      <textarea id="f-setup" placeholder="Carrossage, parallélisme, barre, amortisseurs…">${source ? escapeHtml(source.setup||'') : ''}</textarea>

      <label>Usure constatée</label>
      <textarea id="f-wear" placeholder="État des épaulements, granulation…">${editingSession ? escapeHtml(editingSession.wear||'') : ''}</textarea>

      <div class="form-actions">
        <button class="btn btn-ghost" id="form-cancel">Annuler</button>
        <button class="btn btn-primary" id="form-save">Enregistrer</button>
      </div>
    </main>
  `;

  const tagPos = document.getElementById('tag-pos');
  v.querySelectorAll('#f-types .chip').forEach(c=>{
    c.onclick = () => {
      selType = (selType === c.dataset.t) ? '' : c.dataset.t;
      v.querySelectorAll('#f-types .chip').forEach(x=>x.classList.toggle('active', x.dataset.t === selType));
    };
  });
  v.querySelectorAll('#f-poscar button').forEach(b=>{
    b.onclick = () => {
      selPos = (selPos === b.dataset.p) ? null : b.dataset.p;
      v.querySelectorAll('#f-poscar button').forEach(x=>x.classList.toggle('active', x.dataset.p === selPos));
      if(tagPos){
        tagPos.textContent = selPos || '';
        tagPos.style.display = selPos ? '' : 'none';
      }
    };
  });

  document.getElementById('form-back').onclick = () => go('detail', { tireKey: tire.key });
  document.getElementById('form-cancel').onclick = () => go('detail', { tireKey: tire.key });
  document.getElementById('form-save').onclick = async () => {
    const session = {
      id: editingSession ? editingSession.id : Date.now(),
      date: document.getElementById('f-date').value || todayStr(),
      location: document.getElementById('f-loc').value.trim(),
      sessionType: selType || '',
      position: selPos || null,
      laps: document.getElementById('f-laps').value,
      km: document.getElementById('f-km').value,
      pressureCold: document.getElementById('f-pcold').value,
      pressureHot: document.getElementById('f-phot').value,
      setup: document.getElementById('f-setup').value.trim(),
      wear: document.getElementById('f-wear').value.trim(),
    };
    if(editingSession){
      const idx = tire.sessions.findIndex(x=>x.id===editingSession.id);
      if(idx>-1) tire.sessions[idx] = session;
    } else {
      tire.sessions.push(session);
    }
    if(session.position) tire.position = session.position;
    const ok = await saveTire(tire.key, tire);
    openSet(tire.key).add(session.id); // le roulage reste déplié au retour
    showToast(ok ? (editingSession ? 'Roulage modifié' : 'Roulage enregistré') : "Erreur d'enregistrement");
    go('detail', { tireKey: tire.key });
  };
}

render();
</script>
</body>
</html>
